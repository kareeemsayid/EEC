name: Deploy to Azure Static Web Apps
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3

      - name: Install OIDC dependencies
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get GitHub OIDC Token
        id: get-token
        uses: actions/github-script@v6
        with:
          script: |
            const { HttpClient } = require('@actions/http-client');

            const idTokenUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const idTokenToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;

            if (!idTokenUrl || !idTokenToken) {
              core.setFailed('OIDC token endpoint not available');
              return;
            }

            const http = new HttpClient();
            const response = await http.get(`${idTokenUrl}&audience=api://AzureADTokenExchange`, {
              Authorization: `Bearer ${idTokenToken}`
            });
            const body = await response.readBody();
            const data = JSON.parse(body);
            core.setOutput('id_token', data.value);

      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_COAST_018453310 }}
          action: "upload"
          app_location: "/"
          api_location: "backend"
          output_location: "build"
          github_id_token: ${{ steps.get-token.outputs.id_token }}
        env:
          REACT_APP_AZURE_AD_CLIENT_ID: ${{ secrets.REACT_APP_AZURE_AD_CLIENT_ID }}
          REACT_APP_AZURE_AD_TENANT_ID: ${{ secrets.REACT_APP_AZURE_AD_TENANT_ID }}
          REACT_APP_AZURE_AD_REDIRECT_URI: ${{ secrets.REACT_APP_AZURE_AD_REDIRECT_URI }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
